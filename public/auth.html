<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - AgriTech Pro</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --accent: #0ea5e9;
      --accent-strong: #0284c7;
      --accent-light: #e0f2fe;
      --text: #0c4a6e;
      --text-muted: #64748b;
      --surface: rgba(255, 255, 255, 0.96);
      --border: #e5e7eb;
    }

    [data-theme-mode="dark"] {
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --accent-light: #0c4a6e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --surface: rgba(30, 41, 59, 0.95);
      --border: rgba(71, 85, 105, 0.4);
    }

    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      padding: 1rem;
      position: relative;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    [data-theme-mode="dark"] .auth-container {
      background: linear-gradient(135deg, #0c4a6e 0%, #075985 100%);
    }

    .auth-container::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      animation: float 6s ease-in-out infinite;
    }

    .auth-container::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }

    .auth-card {
      background: var(--surface);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 1;
      transition: background 0.3s ease;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
      transition: background 0.3s ease;
    }

    .auth-header-icon svg {
      width: 32px;
      height: 32px;
      color: white;
    }

    .auth-header h1 {
      color: var(--text);
      margin: 0 0 0.5rem 0;
      font-size: 1.75rem;
      font-weight: 700;
      transition: color 0.3s ease;
    }

    .auth-header p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 2rem;
      background: var(--accent-light);
      border-radius: 12px;
      padding: 4px;
      transition: background 0.3s ease;
    }

    [data-theme-mode="dark"] .auth-tabs {
      background: rgba(56, 189, 248, 0.15);
    }

    .auth-tab {
      flex: 1;
      padding: 0.875rem;
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.3s ease;
      border-radius: 8px;
    }

    .auth-tab.active {
      color: var(--accent);
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    [data-theme-mode="dark"] .auth-tab.active {
      background: rgba(30, 41, 59, 0.95);
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text);
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: var(--surface);
      color: var(--text);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px var(--accent-light);
    }

    [data-theme-mode="dark"] .form-group input:focus {
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .auth-button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      margin-top: 0.5rem;
    }

    .auth-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
    }

    .auth-button:active {
      transform: translateY(0);
    }

    .auth-form {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-form.active {
      display: block;
    }

    .auth-link {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
    }

    .auth-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-link a:hover {
      color: var(--accent-strong);
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      color: white;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <button class="theme-toggle" id="theme-toggle" aria-label="Changer le thème">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
            <circle cx="9" cy="14" r="1"/>
            <circle cx="15" cy="14" r="1"/>
          </svg>
        </div>
        <h1>AgriTech Pro</h1>
        <p>Plateforme de Gestion Agricole</p>
      </div>
      
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Connexion</button>
        <button class="auth-tab" data-tab="register">Inscription</button>
      </div>
      
      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="votre@email.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="auth-button">Se connecter</button>
      </form>
      
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="register-name">Nom</label>
          <input type="text" id="register-name" required placeholder="Votre nom" />
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" required placeholder="votre@email.com" />
        </div>
        <div class="form-group">
          <label for="register-password">Mot de passe</label>
          <input type="password" id="register-password" required placeholder="••••••••" minlength="6" />
        </div>
        <div class="form-group">
          <label for="register-farm">Nom de la ferme (optionnel)</label>
          <input type="text" id="register-farm" placeholder="Ma ferme" />
        </div>
        <button type="submit" class="auth-button">S'inscrire</button>
      </form>
      
      <div class="auth-link">
        <a href="/">← Retour à l'accueil</a>
      </div>
    </div>
  </div>
  
  <script src="auth.js"></script>
</body>
</html>
